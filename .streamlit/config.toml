[server]
# Tamaño máximo por archivo subido, en MB.
maxUploadSize = 500

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Paleta tomada del diseño (Plus Jakarta Sans + índigo).
# Si no hay internet, la fuente cae a la sans-serif del sistema.
[theme]
base = "light"
primaryColor = "#524CE3"
backgroundColor = "#F9FAFE"
secondaryBackgroundColor = "#EFF1FA"
textColor = "#181844"
borderColor = "#DEE0EF"
baseRadius = "0.75rem"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [800, 700]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF1FA"
